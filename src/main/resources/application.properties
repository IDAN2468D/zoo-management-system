spring.application.name=management
server.port=9091

# H2 In-Memory Database (Default for local development & testing)
spring.datasource.url=jdbc:h2:mem:zoodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Enable H2 Web Console at http://localhost:9091/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Docker Desktop Clean Console Logging Format
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([zoo-app]){magenta} %clr(:){faint} %m%n
logging.level.com.zoo.management=INFO
logging.level.ZooAuditLog=INFO

# PostgreSQL Configuration (Uncomment and edit when switching to a real PostgreSQL instance):
# spring.datasource.url=jdbc:postgresql://localhost:5432/zoodb
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect